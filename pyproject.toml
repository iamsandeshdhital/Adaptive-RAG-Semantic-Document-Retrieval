[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-rag"
version = "1.0.0"
description = "Semantic document retrieval: comparing BM25, dense and hybrid retrieval with fixed-size and paragraph chunking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Anurag Jha" },
    { name = "Sandesh Dhital" },
]
keywords = ["retrieval-augmented-generation", "information-retrieval", "bm25", "dense-retrieval", "chunking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
llm = ["anthropic>=1.0"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8.0"]

[project.scripts]
adaptive-rag = "adaptive_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
